<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8fc">
  <title>BadmintonHub — Tema Terang & Gelap</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f8fc; color: #0f172a; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 560px; padding: 28px; border: 1px solid #dbe4ef; border-radius: 20px; background: white; box-shadow: 0 16px 48px #0f172a12; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { line-height: 1.6; color: #475569; }
    a { color: #047857; }
  </style>
</head>
<body>
  <main>
    <h1>BadmintonHub sedang dimuat…</h1>
    <p>Menyiapkan materi edukasi dan simulasi bulutangkis.</p>
    <noscript>Aktifkan JavaScript untuk membuka BadmintonHub.</noscript>
  </main>
  <script>
    (async function () {
      const source = 'https://raw.githubusercontent.com/winatamandika-hub/tugasasjandika/df8e643eed82137bd12a0d294a3b7dcea1ebeee1/index.html';
      try {
        const response = await fetch(source, { cache: 'force-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        html = html.replace('</head>', '<link rel="stylesheet" href="./theme.css"><script src="./theme.js"><\/script></head>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('main').innerHTML = '<h1>BadmintonHub tidak dapat dimuat</h1><p>Periksa koneksi internet, lalu muat ulang halaman. ' + error.message + '</p><p><a href="https://github.com/winatamandika-hub/tugasasjandika">Buka repositori</a></p>';
      }
    }());
  </script>
</body>
</html>
